name: managehub

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - path: ./deploy/runtime/mysql.env
        format: raw
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.2
    restart: unless-stopped
    env_file:
      - path: ./deploy/runtime/redis.env
        format: raw
    # 官方入口负责降权并加载 JSON / Search；shell 仅负责展开密码环境变量。
    command: ["sh", "-c", "exec /usr/local/bin/docker-entrypoint.sh redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Hub-service
    restart: unless-stopped
    env_file:
      - path: ./deploy/runtime/backend.env
        format: raw
    environment:
      TZ: Asia/Shanghai
      APP_ROOT_PATH: /api
      # 后端仅在容器网络可访问；信任 Nginx 重写的客户端地址，用于日志和限流。
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-logs:/app/logs
      - knowledge-data:/app/chroma_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 10s
      timeout: 7s
      retries: 20
      start_period: 60s
    stop_grace_period: 30s

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

# 数据独立于容器，重建服务和停止项目都不会清空这些卷。
volumes:
  mysql-data:
  redis-data:
  backend-logs:
  knowledge-data:
