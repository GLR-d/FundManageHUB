# Docker 内置 DNS。后端容器重建后，Nginx 会重新解析它的地址。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
    zone api_backend 64k;
    server backend:8080 resolve;
    keepalive 16;
}

# 访问日志不记录查询参数，避免账单搜索内容等进入日志。
log_format without_args '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    server_tokens off;
    # 保持相对跳转，浏览器继续使用 Docker 映射的 8088 等外部端口。
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    access_log /var/log/nginx/access.log without_args;
    error_log /var/log/nginx/error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    # 末尾的 / 将 /api/fund 转为后端的 /fund。
    location /api/ {
        proxy_pass http://api_backend/;
        # 后端补齐尾斜杠时，保留浏览器使用的 /api 前缀。
        proxy_redirect http://$http_host/ /api/;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 聊天 SSE 回复生成一段就发送一段。
        proxy_buffering off;
        proxy_cache off;
    }

    # 带内容哈希的资源长期缓存；找不到资源时不回退为 HTML。
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vue 页面刷新时返回入口，接口仍由上面的 /api/ 转发。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
